; XIAO ESP32S3 Sense + Seeed Round Display - XIAO Arcade
; Kaynak klasoru Arduino IDE ile de acilabilsin diye XiaoRoundArcade/ altinda.

[platformio]
src_dir = XiaoRoundArcade

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git
    bodmer/TJpg_Decoder
build_flags =
    ; Seeed_GFX: 501 = Round Display for Seeed Studio XIAO (GC9A01 + CHSC6X touch)
    ; (driver.h kutuphane tarafindan PlatformIO'da gorulmedigi icin burada da veriyoruz)
    -DBOARD_SCREEN_COMBO=501
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DARDUINO_USB_CDC_ON_BOOT=1
